<!DOCTYPE html>
<html lang="en" class="transition-colors duration-500">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 flex items-center justify-center min-h-screen transition-colors duration-500">

  <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md transition-colors duration-500">
    <h2 class="text-3xl font-bold mb-6 text-center text-gray-800 dark:text-white">Reset Password</h2>
    <p class="text-center text-gray-500 dark:text-gray-400 mb-6">
      Enter OTP received and set your new password.
    </p>

    <form method="POST" id="resetForm" class="space-y-5">
      {% csrf_token %}
      {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
        <p class="text-center text-red-500 font-semibold">{{ message }}</p>
        {% endfor %}
      </div>
      {% endif %}

      <!-- OTP -->
      <div>
        <label for="otp" class="block text-gray-700 dark:text-gray-300 font-semibold mb-2">OTP</label>
        <input type="text" name="otp" id="otp" placeholder="Enter OTP"
          class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
          required maxlength="6">
      </div>

      <!-- OTP Timer + Resend -->
      <div class="flex justify-between items-center">
        <span id="otpTimer" class="font-bold text-blue-600">2:00</span>
        <button type="button" id="resendBtn" class="text-sm text-blue-500 hover:underline disabled:text-gray-400" disabled>Resend OTP</button>
      </div>

      <!-- New Password -->
      <div class="relative">
        <label for="new_password" class="block text-gray-700 dark:text-gray-300 font-semibold mb-2">New Password</label>
        <input type="password" name="new_password" id="new_password" placeholder="Enter new password"
          class="w-full px-4 py-3 pr-12 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
          required minlength="4" maxlength="10">
        <button type="button" onclick="togglePassword('new_password', this)"
          class="absolute inset-y-0 right-3 top-[38px] flex items-center text-gray-500 dark:text-gray-300 hover:text-blue-600 transition">
          <i data-lucide="eye"></i>
        </button>
      </div>

      <!-- Confirm Password -->
      <div class="relative">
        <label for="confirm_password" class="block text-gray-700 dark:text-gray-300 font-semibold mb-2">Confirm Password</label>
        <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm password"
          class="w-full px-4 py-3 pr-12 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
          required minlength="4" maxlength="10">
        <button type="button" onclick="togglePassword('confirm_password', this)"
          class="absolute inset-y-0 right-3 top-[38px] flex items-center text-gray-500 dark:text-gray-300 hover:text-blue-600 transition">
          <i data-lucide="eye"></i>
        </button>
      </div>

      <p id="passwordError" class="text-red-500 text-sm mt-2 hidden">⚠️ Passwords do not match!</p>

      <button type="submit"
        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg transition">
        Reset Password
      </button>

    </form>
  </div>

  <script>
    const resendBtn = document.getElementById('resendBtn');
    const otpTimer = document.getElementById('otpTimer');
    let otpTime = 120;
    let otpInterval;

    function startOtpCountdown() {
      resendBtn.disabled = true;
      otpInterval = setInterval(() => {
        let minutes = Math.floor(otpTime / 60);
        let seconds = otpTime % 60;
        otpTimer.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        otpTime--;
        if (otpTime < 0) {
          clearInterval(otpInterval);
          otpTimer.textContent = 'OTP expired';
          resendBtn.disabled = false;
        }
      }, 1000);
    }

    startOtpCountdown();

    // Resend OTP
    resendBtn.addEventListener('click', () => {
      otpTime = 120;
      startOtpCountdown();
      fetch('/resend_reset_otp/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({ email: '{{ user_email }}' })
      }).then(res => res.json()).then(data => {
        if (data.status === 'ok') {
          alert('OTP resent successfully!');
        } else {
          alert(data.error || 'Failed to resend OTP');
        }
      });
    });

    // Toggle Password
    function togglePassword(id, button) {
      const input = document.getElementById(id);
      const icon = button.querySelector("i");
      if (input.type === "password") {
        input.type = "text";
        icon.setAttribute("data-lucide", "eye-off");
      } else {
        input.type = "password";
        icon.setAttribute("data-lucide", "eye");
      }
      lucide.createIcons();
    }
    lucide.createIcons();
  </script>

</body>
</html>
