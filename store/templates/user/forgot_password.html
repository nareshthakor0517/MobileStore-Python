{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
   
  <meta charset="UTF-8">
   
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
   
  <script src="https://cdn.tailwindcss.com"></script>
    <style>
    /* 🎯 CRITICAL FIX: Ensure no horizontal scrollbar */
    body {
      overflow: hidden;
      /* Fixes horizontal scrollbar */
    }

    .dark-bg {
      background-color: #000000;
    }

    .dark-text {
      color: #f0f0f0;
    }

    .input-dark {
      background-color: #222222;
      border: 2px solid #555555;
      color: #f0f0f0;
      transition: border-color 0.3s;
    }

    .input-dark:focus {
      border-color: #4f46e5;
    }
  </style>
</head>

<body class="dark-bg flex items-center justify-center">

  <div class="h-screen w-full flex items-center justify-center">

<div class="
    w-full        
    px-4 py-6     
    rounded-lg     
    sm:max-w-md   
    sm:mx-auto    
    sm:px-12 sm:py-10
">
                  <h2 class="text-3xl font-bold dark-text text-center mb-6">Forgot Password</h2>

                  {% if messages %}
                  <div class="mb-2" id="messagesContainer">
                      {% for message in messages %}
                      <p class="text-center {% if message.tags == 'error' %}text-red-500{% else %}text-green-500{% endif %} font-semibold">
                          {{ message }}
                      </p>
                      {% endfor %}
                  </div>
                  {% endif %}


                  <form method="POST" id="forgotForm">
                          {% csrf_token %}
                         
                          <label class="block mt-[-15%] font-medium dark-text">Email</label>
                          <input type="text" name="email_or_mobile" required
          class="w-full px-3 py-3 rounded input-dark"         id="emailInput"
          placeholder="Enter your email or mobile">
                         
                          <button type="submit" id="sendOtpBtn"        
          class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded font-bold transition duration-300">
                                  Send OTP
                              </button>
                      </form>

                  <p id="feedbackMessage" class="mt-[-10%] text-center dark-text hidden"></p>
              </div>
  </div>
       
   
  <script>
document.getElementById('forgotForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const form = e.target;
    const feedback = document.getElementById('feedbackMessage');
    const sendBtn = document.getElementById('sendOtpBtn');

    sendBtn.disabled = true;
    feedback.textContent = 'Sending OTP...';
    feedback.classList.remove('hidden');
    feedback.classList.remove('text-red-500', 'text-green-500');

    const formData = new FormData(form);

    fetch("{% url 'forgot_password' %}", {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'ok') {
            feedback.textContent = data.message;
            feedback.classList.add('text-green-500');
            setTimeout(() => {
                window.location.href = "{% url 'verify_otp' %}";
            }, 500);
        } else {
            feedback.textContent = data.error || 'Error sending OTP.';
            feedback.classList.remove('text-green-500');
            feedback.classList.add('text-red-500');
            sendBtn.disabled = false;
        }

        // Auto-hide feedback after 1 second
        setTimeout(() => {
            feedback.style.transition = "opacity 0.5s";
            feedback.style.opacity = 0;
            setTimeout(() => { 
                feedback.textContent = ''; 
                feedback.classList.add('hidden');
                feedback.style.opacity = 1; // reset for next time
            }, 500);
        }, 2500);
    })
    .catch(error => {
        console.error('Fetch Error:', error);
        feedback.textContent = 'A network error occurred.';
        feedback.classList.remove('text-green-500');
        feedback.classList.add('text-red-500');
        sendBtn.disabled = false;

        // Auto-hide feedback after 1 second
        setTimeout(() => {
            feedback.style.transition = "opacity 0.5s";
            feedback.style.opacity = 0;
            setTimeout(() => { 
                feedback.textContent = ''; 
                feedback.classList.add('hidden');
                feedback.style.opacity = 1;
            }, 500);
        }, 1500);
    });
});
</script>

</body>

</html>
